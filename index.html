    </section>

    <div class="juego">

        <h2 id="nombre"></h2>
        <img id="pokemon" src="" alt="pokemon">
    <div>
        
        <button onclick="atrapar()">atrapar</button>
        <button onclick="escapar()">escapar</button>

    </div>

    <p id="mensaje"></p>

    <h2>pokes atrapados</h2>
    
    <p id="contador">pokemon atrapados: 0</p>
    
    <div id="coleccion"></div>

</div>
